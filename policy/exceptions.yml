version: 1

# Policy exceptions are explicit, reviewable and time-bounded.
# Do not record secret values in this file.
#
# Required fields for each entry:
# - id
# - status: proposed | approved | expired | revoked
# - scope.host
# - scope.compose_project
# - scope.compose_service (use "*" only for an explicitly reviewed project-wide exception)
# - type: floating-image | digest-unavailable | downgrade | local-build-provenance | secret-environment
# - rationale
# - risk
# - compensating_controls
# - owner
# - approved_by
# - approved_on
# - review_on
# - rollback_method
# - evidence
#
# Example:
#
# exceptions:
#   - id: EX-2026-001
#     status: proposed
#     scope:
#       host: ids-01
#       compose_project: greenbone-community-edition
#       compose_service: "*"
#     type: floating-image
#     rationale: Vendor stack uses coordinated channel tags.
#     risk: A moving tag can resolve to a different image unexpectedly.
#     compensating_controls:
#       - Record resolved digests before deployment.
#       - Validate the complete vendor stack as one change.
#     owner: homelab-operations
#     approved_by: pending
#     approved_on: null
#     review_on: 2026-09-30
#     rollback_method: Restore recorded pre-change Compose revision and image digests.
#     evidence:
#       - docs/stage0-baseline-findings.md

exceptions:
  - id: EX-2026-001
    status: approved
    scope:
      host: ids-01
      compose_project: greenbone-community-edition
      compose_service: "*"
    type: floating-image
    rationale: >-
      Greenbone Community Containers use a coordinated rolling-release
      Compose model. Vendor workflows require using the latest compose.yaml,
      pulling updated service and feed-data images, and loading feed content
      through the running daemons. Independently pinning the 20 component
      containers could break vendor-supported stack and feed coordination.
    risk: >-
      A moving tag or untagged image can resolve to a different artifact
      without the Git declaration changing, and a vendor Compose update can
      introduce coordinated architecture or database changes.
    compensating_controls:
      - Download and review the current vendor compose.yaml before an update.
      - Treat the complete Greenbone project as one elevated change.
      - Record every resolved pre-change and candidate image digest.
      - Capture the current Git revision and database/volume backup evidence.
      - Validate Compose before pull or recreation.
      - Verify container health, Greenbone login, scanner readiness and feed status.
      - Retain pre-change image digests until the acceptance window passes.
      - Do not allow WUD or another runtime tool to deploy the update directly.
    owner: homelab-operations
    approved_by: jrwroberts1976
    approved_on: 2026-08-23
    review_on: 2026-09-30
    rollback_method: >-
      Restore the recorded pre-change compose revision and exact image
      digests. Do not downgrade pg-gvm or restore database state without the
      service-specific backup and compatibility procedure.
    evidence:
      - docs/stage0-baseline-findings.md
      - https://greenbone.github.io/docs/latest/22.4/container/index.html
      - https://greenbone.github.io/docs/latest/22.4/container/workflows.html

