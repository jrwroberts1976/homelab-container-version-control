schema_version: 1

authority:
  repository: jrwroberts1976/docker-env
  sops_policy: .sops.yaml

secrets:
  autokuma_kuma_password:
    service: autokuma
    compose_secret: autokuma_kuma_password
    encrypted_source: secrets/testserver/autokuma.sops.env
    encrypted_format: dotenv
    recovery_key: AUTOKUMA_KUMA_PASSWORD
    runtime_path: /home/james/docker/secrets/autokuma-kuma-password
    required_mode: "0400"
    require_nonempty: true
    require_exact_recovery_match: true

  cloudflare_api_token:
    service: cloudflare-ddns
    compose_secret: cloudflare_api_token
    encrypted_source: secrets/testserver/cloudflare-ddns.sops.env
    encrypted_format: dotenv
    recovery_key: CLOUDFLARE_API_TOKEN
    runtime_path: /home/james/docker/secrets/cloudflare-api-token
    required_mode: "0400"
    require_nonempty: true
    require_exact_recovery_match: true

  duckdns_token:
    service: duckdns
    compose_secret: duckdns_token
    encrypted_source: secrets/testserver/duckdns.sops.env
    encrypted_format: dotenv
    recovery_key: DUCKDNS_TOKEN
    runtime_path: /home/james/docker/secrets/duckdns-token
    required_mode: "0400"
    require_nonempty: true
    require_exact_recovery_match: true

runtime_configuration:
  autokuma_kuma_username:
    service: autokuma
    source_type: dotenv
    source_path: /home/james/docker/stacks/availability/.env
    source_key: AUTOKUMA_KUMA_USERNAME
    runtime_environment_key: AUTOKUMA__KUMA__USERNAME
    require_nonempty: true
    require_exact_runtime_match: true
